<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>老日香廟街籤詩館</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--red:#8b1a1a;--gold:#e8b84a;--wood:#5b3a21;--cream:#fbf3e0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
html,body{min-height:100%;margin:0;font-family:"Noto Serif TC","PMingLiU",serif;background:radial-gradient(ellipse at top,#7a1c1c,#3b0d0d 70%) fixed;color:var(--cream)}
.pg{display:none;min-height:100vh;padding:20px 16px;align-items:center;justify-content:center;flex-direction:column;animation:in .6s ease}
.pg.on{display:flex}@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.panel{background:linear-gradient(#fbf3e0,#f1dfb8);color:#4a2a14;border:3px solid var(--gold);border-radius:16px;box-shadow:0 10px 30px #0008,inset 0 0 20px #c9a45c55}
.btn{background:linear-gradient(#d32f2f,#8b1a1a);color:#ffe8a3;border:2px solid var(--gold);border-radius:999px;padding:12px 28px;font-weight:700;letter-spacing:.1em;box-shadow:0 5px 0 #4a0d0d,0 8px 16px #0007;transition:.15s;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #4a0d0d}.btn:disabled{opacity:.5}
.theme{border:3px solid #c9a45c;border-radius:14px;padding:12px 8px;cursor:pointer;transition:.2s;background:#fff8e6;text-align:center}
.theme.sel{border-color:#c62828;background:#ffe9b8;transform:translateY(-4px) scale(1.03);box-shadow:0 8px 18px #8b1a1a55}
.smoke{position:fixed;bottom:0;width:60px;height:160px;border-radius:50%;background:radial-gradient(#fff4;,transparent 70%);filter:blur(8px);animation:rise 7s linear infinite;pointer-events:none;opacity:0}
@keyframes rise{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:.5}100%{transform:translate(40px,-90vh) scale(2.2);opacity:0}}
.tube{width:120px;height:170px;background:linear-gradient(90deg,#4a2a14,#a0683a 40%,#4a2a14);border-radius:14px 14px 30px 30px;border:3px solid #2a1508;position:relative;margin:auto;box-shadow:0 14px 20px #0009}
.tube:after{content:"籤";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px;color:var(--gold);writing-mode:vertical-rl}
.sticks{position:absolute;top:-44px;left:14px;right:14px;height:60px;display:flex;gap:3px;justify-content:center;align-items:flex-end}
.sticks i{flex:1;background:linear-gradient(#f1d58a,#c9a45c);height:100%;border-radius:3px 3px 0 0}.sticks i:nth-child(2n){height:80%}.sticks i:nth-child(3n){height:92%}
.shake{animation:sh .12s infinite}@keyframes sh{0%{transform:rotate(-9deg)}50%{transform:rotate(9deg) translateY(-6px)}100%{transform:rotate(-9deg)}}
.flystick{position:absolute;left:50%;top:10px;width:18px;height:200px;margin-left:-9px;background:linear-gradient(#f7e4a6,#c9a45c);border-radius:4px;border:1px solid #8a6a2c;display:none;color:#8b1a1a;font-size:12px;writing-mode:vertical-rl;text-align:center;line-height:18px;font-weight:700}
.flystick.go{display:block;animation:fly 1.1s ease-out forwards}@keyframes fly{0%{transform:translateY(0) rotate(0)}60%{transform:translateY(-190px) rotate(-12deg)}100%{transform:translateY(-120px) rotate(-20deg) scale(1.1)}}
.table{width:100%;max-width:420px;padding:36px 16px 24px;border-radius:16px;background:repeating-linear-gradient(90deg,#9c1c1c 0 38px,#8b1414 38px 40px);border-top:10px solid #5a0c0c;box-shadow:0 12px 0 #3a0808,0 20px 30px #000a;text-align:center}
.cake{width:190px;height:190px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:900;cursor:pointer;position:relative;user-select:none;transition:transform .15s;
 filter:drop-shadow(0 14px 10px #0008)}.cake:active{transform:scale(.94)}
.cake.round{border-radius:50%}.cake.sq{border-radius:22px}
.cake.ingot{width:240px;height:150px;border-radius:0}
.cake.ingot:before{content:"";position:absolute;inset:0;z-index:0;clip-path:polygon(0 24%,7% 4%,22% 0,34% 26%,66% 26%,78% 0,93% 4%,100% 24%,88% 88%,74% 100%,26% 100%,12% 88%);background:radial-gradient(ellipse at 50% 30%,#e9c88a,#d3a45e 55%,#a9742f);box-shadow:inset 0 0 20px #fff6}
.cake.ingot span{position:relative;z-index:1;margin-top:18px;font-size:44px}
.c-tan{color:#7a4a14;text-shadow:1px 1px 0 #f6dfaa,-1px -1px 0 #6a3e10,2px 3px 3px #0004}
.emb{letter-spacing:.05em;writing-mode:vertical-rl}
.c-gold{background:radial-gradient(circle at 35% 28%,#fff1a8,#e8b84a 45%,#a8741a);color:#8b1a1a;text-shadow:1px 1px 0 #fff6,-1px -1px 0 #6a4408,2px 3px 3px #0005;box-shadow:inset 0 -10px 16px #7a520f88,inset 0 8px 12px #fff8}
.c-white{background:radial-gradient(circle at 35% 28%,#fffdf5,#f3e6c4 55%,#d9c08a);color:#c62828;text-shadow:1px 1px 0 #fff,-1px -1px 0 #9a1d1d66,2px 3px 3px #0004;box-shadow:inset 0 -10px 16px #b8903f66,inset 0 8px 12px #fff}
.c-brown{background:radial-gradient(circle at 35% 28%,#f4c26a,#d08a2c 50%,#8a5214);color:#5a2a08;text-shadow:1px 1px 0 #ffd99a,-1px -1px 0 #4a2208,2px 3px 3px #0005;box-shadow:inset 0 -10px 16px #5a2a0888,inset 0 8px 12px #ffd99a99}
.spark{position:fixed;pointer-events:none;font-size:20px;animation:sp .9s ease-out forwards;z-index:50}@keyframes sp{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.poster{width:100%;max-width:380px;border:6px double var(--gold);background:linear-gradient(160deg,#a01f1f,#6b1010);position:relative;padding:22px 18px;text-align:center;border-radius:6px;box-shadow:0 14px 34px #000a}
.poster:before{content:"福";position:absolute;font-size:200px;color:#ffffff0d;right:-10px;top:30px;line-height:1}
.vt{writing-mode:vertical-rl;letter-spacing:.3em}
</style></head><body>
<div id="smk"></div>

<!-- P1 -->
<section class="pg on" id="p1"><div class="panel w-full max-w-md p-6 text-center">
<div class="text-sm tracking-[.4em] text-red-800">新莊廟街・老日香</div>
<h1 class="text-3xl font-black text-red-800 mt-1">老日香廟街籤詩館</h1>
<p class="mt-1 mb-4 text-amber-900">搖出專屬籤詩，吃出滿滿好運</p>
<input id="nm" maxlength="8" placeholder="請輸入您的姓名／暱稱" class="w-full rounded-lg border-2 border-amber-600 bg-white/80 px-4 py-3 text-center text-lg outline-none focus:border-red-700">
<p class="mt-4 mb-2 text-sm text-amber-900">請選擇祈福主題</p>
<div class="grid grid-cols-3 gap-2" id="themes">
<div class="theme" data-t="wealth"><div class="text-3xl">💰</div><b class="text-sm">求財運</b><div class="text-xs text-amber-800 mt-1">招財糕</div></div>
<div class="theme" data-t="health"><div class="text-3xl">🌸</div><b class="text-sm">求健康平安</b><div class="text-xs text-amber-800 mt-1">心願糕</div></div>
<div class="theme" data-t="study"><div class="text-3xl">📚</div><b class="text-sm">求事業學業</b><div class="text-xs text-amber-800 mt-1">狀元餅</div></div></div>
<p id="err" class="text-red-700 text-sm h-5 mt-2"></p>
<button class="btn mt-1" id="go1">虔誠祈福・開始搖籤</button></div></section>

<!-- P2 -->
<section class="pg" id="p2"><h2 class="text-2xl font-black text-amber-200 mb-1" id="hint">點擊或搖晃籤筒以求籤...</h2>
<p class="text-amber-100/70 mb-14 text-sm" id="who"></p>
<div class="relative w-[200px] h-[240px] flex items-end justify-center"><div class="flystick" id="fs"></div><div class="tube" id="tube"><div class="sticks"><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div>
<div class="text-6xl font-black text-amber-300 h-20 mt-6" id="cd"></div>
<button class="btn" id="shake">搖晃籤筒</button></section>

<!-- P3 -->
<section class="pg" id="p3"><div class="panel w-full max-w-sm p-5 text-center">
<div class="flex gap-4 items-center justify-center"><div class="vt text-3xl font-black text-red-800 border-2 border-red-800 px-2 py-3 rounded" id="fn"></div>
<div><div class="text-sm text-amber-800" id="fno"></div><div class="text-4xl font-black text-red-700 my-1" id="fg"></div></div></div>
<div class="my-3 text-lg leading-8 font-bold" id="fp"></div><div class="text-sm text-amber-900" id="fe"></div></div>
<div class="my-5" id="cake3"></div>
<p class="max-w-xs text-center mb-3" id="bless"></p><button class="btn" id="to4">前往供桌</button></section>

<!-- P4 -->
<section class="pg" id="p4"><h2 class="text-xl font-black text-amber-200 mb-5">點擊糕點，把好運吃進肚子裡</h2>
<div class="table"><div id="cake4"></div><div class="mt-6 text-amber-100 text-sm" id="bites">還剩 3 口</div></div>
<div id="done" class="hidden mt-6 panel p-4 text-center max-w-xs"><div class="text-xl font-black text-red-700">好運已入口，福氣隨身走！</div><button class="btn mt-3" id="to5">領取開運賀卡</button></div></section>

<!-- P5 -->
<section class="pg" id="p5"><div class="poster" id="poster">
<div class="text-amber-300 tracking-[.5em] text-xs">老日香開運心願賀卡</div>
<div class="text-4xl font-black text-amber-200 my-2" id="pn"></div>
<div class="inline-block bg-amber-300 text-red-900 font-bold rounded-full px-4 py-1 text-sm" id="pt"></div>
<div class="flex justify-center gap-5 items-center my-4"><div class="vt text-2xl font-black text-amber-200 border-2 border-amber-300 px-2 py-3 rounded" id="pf"></div>
<div id="pimg" class="w-36 h-36 rounded-xl overflow-hidden border-2 border-amber-300 flex items-center justify-center bg-red-900"></div></div>
<div class="text-lg font-bold leading-8 text-amber-100" id="pp"></div>
<div class="mt-3 text-xs leading-6 text-amber-100/80 border-t border-amber-300/40 pt-3" id="pd"></div>
<div class="mt-3 text-xs text-amber-200" id="pl"></div></div>
<button class="btn mt-6" id="again">再次求籤</button></section>

const $=s=>document.querySelector(s);
const T={wealth:{n:"求財運",cake:"招財糕",txt:"發財",img:IMG3,cls:"c-tan ingot",desc:"嚴選純綠豆粉與白米粉製作，堅持不添加綠色香料，低糖低脂，以水蒸程序長時製作的糕點，有別於綠豆糕的鬆軟，潤糕Q度廣受好評。"},
health:{n:"求健康平安",cake:"心願糕",txt:"平安",cls:"c-white round",img:IMG1,desc:"滿載心意與祈福願望的心願糕，精選純米粉與糯米粉製成的原味潤糕，及純綠豆粉與糯米粉製成的綠豆潤糕，搭配吉祥的話語，是值得享用的新一代創新古早味米食～"},
study:{n:"求事業學業",cake:"狀元餅",txt:"狀元",cls:"c-brown sq",img:IMG2,desc:"黃紮實的餅皮，搭配內餡微甜的綠豆沙饀，添加鹹蛋黃和豬肉條，鹹甜鹹甜懷舊好風味！"}};
const F={wealth:[["吉星高照","大吉","財星入宅福自來，\n貴人相助步步開。"],["金玉滿堂","上上","春風得意馬蹄疾，\n一路長紅好運來。"],["財源廣進","中吉","勤耕心田終有穫，\n穩紮穩打富可期。"]],
health:[["平安喜樂","大吉","闔家團圓福氣長，\n身心康泰日日祥。"],["福壽綿長","上上","心寬自有天來護，\n笑口常開萬事通。"],["順心如意","中吉","和風細雨潤心田，\n平安順遂度流年。"]],
study:[["魁星點斗","大吉","十年磨劍今朝試，\n金榜題名第一枝。"],["鵬程萬里","上上","志存高遠恆心在，\n事業青雲步步高。"],["穩步青雲","中吉","耐得寂寞方成器，\n貴人提攜路自寬。"]]};
let st={name:"",theme:"",f:null,bites:3};
function show(id){document.querySelectorAll(".pg").forEach(p=>p.classList.remove("on"));$(id).classList.add("on");scrollTo(0,0)}
// smoke
for(let i=0;i<8;i++){const d=document.createElement("div");d.className="smoke";d.style.left=(i*13)+"%";d.style.animationDelay=(i*0.9)+"s";d.style.animationDuration=(6+i%3*2)+"s";$("#smk").append(d)}
// audio
let ac;function tick(f=180,l=.05){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type="square";o.frequency.value=f+Math.random()*120;g.gain.value=.15;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+l);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+l)}catch(e){}}
function chime(){[660,880,1320].forEach((f,i)=>setTimeout(()=>tick(f,.3),i*120))}
document.querySelectorAll(".theme").forEach(e=>e.onclick=()=>{document.querySelectorAll(".theme").forEach(x=>x.classList.remove("sel"));e.classList.add("sel");st.theme=e.dataset.t;$("#err").textContent=""});
$("#go1").onclick=()=>{const n=$("#nm").value.trim();if(!n)return $("#err").textContent="請先輸入您的姓名／暱稱";if(!st.theme)return $("#err").textContent="請選擇一個祈福主題";
st.name=n;$("#who").textContent=n+"，請誠心默念您的心願";$("#hint").textContent="點擊或搖晃籤筒以求籤...";$("#cd").textContent="";$("#fs").className="flystick";$("#shake").disabled=false;show("#p2")};
let busy=false;
function doShake(){if(busy)return;busy=true;$("#shake").disabled=true;const tb=$("#tube");tb.classList.add("shake");$("#hint").textContent="誠心祈禱中...";
const iv=setInterval(()=>tick(),130);let c=3;$("#cd").textContent=c;
const t=setInterval(()=>{c--;$("#cd").textContent=c||"";if(c<=0){clearInterval(t);clearInterval(iv);tb.classList.remove("shake");
st.f=F[st.theme][Math.floor(Math.random()*3)];const no=Math.floor(Math.random()*60)+1;st.no=no;
const fs=$("#fs");fs.textContent="第"+no+"籤";fs.classList.add("go");chime();$("#hint").textContent="籤飛出來了！";setTimeout(()=>{busy=false;render3()},1500)}},1000)}
$("#shake").onclick=doShake;$("#tube").onclick=doShake;
if(window.DeviceMotionEvent)addEventListener("devicemotion",e=>{const a=e.accelerationIncludingGravity;if(a&&$("#p2").classList.contains("on")&&Math.abs(a.x||0)+Math.abs(a.y||0)>28)doShake()});
function cakeHTML(k,id){const c=T[k];
if(k=="health")return `<div id="${id}" class="flex gap-3 justify-center">`+["平","安"].map(ch=>`<div class="cake ${c.cls}" style="width:140px;height:140px;font-size:62px"><span>${ch}</span></div>`).join("")+`</div>`;return `<div class="cake ${c.cls}" id="${id}"><span class="${c.txt.length>1&&k!="wealth"?"emb":""}">${c.txt}</span></div>`}
function render3(){const c=T[st.theme],f=st.f;$("#fn").textContent=f[0];$("#fno").textContent="第 "+st.no+" 籤";$("#fg").textContent=f[1];
$("#fp").innerHTML=f[2].replace("\n","<br>");$("#fe").textContent="此籤宜："+c.n;
$("#cake3").innerHTML=cakeHTML(st.theme,"c3");$("#bless").innerHTML="神明為您賜予【"+c.cake+"】！<br>請點擊糕點將好運吃進肚子裡。";
$("#c3").onclick=goEat;$("#to4").onclick=goEat;show("#p3")}
function goEat(){st.bites=3;$("#cake4").innerHTML=cakeHTML(st.theme,"c4");$("#bites").textContent="還剩 3 口";$("#done").classList.add("hidden");$("#c4").onclick=eat;show("#p4")}
const holes=[];
function eat(e){if(st.bites<=0)return;st.bites--;const el=$("#c4"),r=el.getBoundingClientRect();
const ang=[[100,0],[0,100],[100,100]][2-st.bites]; // bite positions
holes.length=0;
const pos=[[88,22,44],[20,78,40],[58,60,38]];
for(let i=0;i<3-st.bites;i++)holes.push(pos[i]);
const m=holes.map(h=>`radial-gradient(circle at ${h[0]}% ${h[1]}%,transparent ${h[2]*0.5}%,#000 ${h[2]*0.5+1}%)`).join(",");
const cs=el.classList.contains("cake")?[el]:[...el.querySelectorAll(".cake")];const sz=st.bites;
cs.forEach(x=>{x.style.webkitMaskImage=x.style.maskImage=holes.length?m:"none";x.style.webkitMaskComposite="source-in";x.style.maskComposite="intersect";x.style.transform="scale("+(0.55+0.15*sz+0.1)+")"});
tick(500,.12);const cx=e.clientX||r.left+r.width/2,cy=e.clientY||r.top+r.height/2;
for(let i=0;i<16;i++){const s=document.createElement("div");s.className="spark";s.textContent=["✨","🪙","🌸","💛"][i%4];s.style.left=cx+"px";s.style.top=cy+"px";s.style.setProperty("--dx",(Math.random()*240-120)+"px");s.style.setProperty("--dy",(-Math.random()*180-20)+"px");document.body.append(s);setTimeout(()=>s.remove(),1000)}
$("#bites").textContent=st.bites?("還剩 "+st.bites+" 口"):"福氣滿滿！";
if(!st.bites){setTimeout(()=>{el.style.opacity=0;el.style.transition=".4s";chime();$("#done").classList.remove("hidden")},350)}}
$("#to5").onclick=()=>{const c=T[st.theme],f=st.f,d=new Date();
$("#pn").textContent=st.name;$("#pt").textContent="祈願主題・"+c.n;$("#pf").textContent=f[0];
$("#pp").innerHTML=f[2].replace("\n","<br>")+"<div class='text-amber-300 text-base mt-1'>第"+st.no+"籤・"+f[1]+"</div>";
$("#pimg").innerHTML=c.img?`<img src="${c.img}" class="w-full h-full object-cover" alt="${c.cake}">`:`<div class="cake c-gold ingot" style="transform:scale(.55);filter:none"><span class="emb">發財</span></div>`;
$("#pd").innerHTML="<b class='text-amber-200'>老日香【"+c.cake+"】</b><br>"+c.desc;
$("#pl").textContent="開運日　"+d.getFullYear()+"."+(d.getMonth()+1)+"."+d.getDate()+"　幸運數字 "+(st.no%9+1)+"　新莊廟街・老日香";show("#p5")};
$("#again").onclick=()=>{$("#nm").value="";st.theme="";document.querySelectorAll(".theme").forEach(x=>x.classList.remove("sel"));show("#p1")};
</script></body></html>
